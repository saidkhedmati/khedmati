name: khedmati
description: "تطبيق خدماتي - اربط بين الباحثين عن خدمة ومقدمي الخدمة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase - قاعدة البيانات والمصادقة الحقيقية
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5
  firebase_storage: ^11.6.6
  firebase_database: ^10.4.9
  google_sign_in: ^6.2.1

  # أدوات مساعدة
  image_picker: ^1.0.7
  intl: ^0.19.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
